<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Blocked</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: #f6f5f3; color: #1c1b19;
  }
  @media (prefers-color-scheme: dark) { body { background: #16181c; color: #e9e8e6; } }
  main { max-width: 420px; padding: 32px 24px; text-align: center; }
  h1 { font-size: 26px; margin: 0 0 8px; letter-spacing: -0.01em; }
  p { margin: 0 0 24px; opacity: .7; }
  .host { font-weight: 600; opacity: 1; }
  button {
    font: inherit; font-weight: 600; cursor: pointer; border-radius: 10px;
    padding: 11px 18px; border: 1px solid transparent; background: #2f6fed; color: #fff;
  }
  button:hover { filter: brightness(1.07); }
  button.hold {
    --progress: 0%;
    user-select: none; -webkit-user-select: none;
    background-image: linear-gradient(to right,
      rgba(255,255,255,.3) var(--progress), transparent var(--progress));
  }
  button[disabled] { opacity: .5; cursor: default; }
  .note { margin-top: 18px; font-size: 13px; opacity: .55; }
</style>
</head>
<body>
  <main>
    <h1>Not right now.</h1>
    <p><span class="host" id="host">This site</span> is blocked.</p>
    <button id="unlock">Hold 10s for 15 minutes</button>
    <div class="note" id="note">The block comes back automatically.</div>
  </main>
  <script src="hold.js"></script>
  <script src="blocked.js"></script>
</body>
</html>
